<?xml version="1.0" encoding="UTF-8"?>
<!-- Lingo Dojo app icon: Sensei Mochi, the dojo master mascot (see
     web/src/components/Mascots.tsx; the same drawing as favicon.svg), sitting
     on a tatami mat with an indigo heri border, in the app's palette. Flat
     shapes only; sips rasterizes via CoreGraphics' basic SVG support, so no
     filters, no text. Rendered to icon-1024.png by render-icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- tile: the indigo heri (mat border) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#3442c6"/>
  <!-- tatami mat -->
  <rect x="74" y="74" width="876" height="876" rx="168" ry="168" fill="#e9e4cf"/>
  <!-- the mat's weave -->
  <g fill="#ded6b6">
    <rect x="74" y="290" width="876" height="14"/>
    <rect x="74" y="390" width="876" height="14"/>
    <rect x="74" y="490" width="876" height="14"/>
    <rect x="74" y="590" width="876" height="14"/>
    <rect x="74" y="690" width="876" height="14"/>
  </g>
  <!-- shadow under Mochi -->
  <ellipse cx="512" cy="836" rx="330" ry="50" fill="#cfc59f"/>
  <!-- Sensei Mochi: the 64-unit drawing at 13x, centred -->
  <g transform="translate(96 52) scale(13)">
    <path d="M7 45C7 25 19 13 32 13C45 13 57 25 57 45C57 55 46 59 32 59C18 59 7 55 7 45Z" fill="#fff8ec" stroke="#1a1c3a" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M10.5 29.5C20 25.5 44 25.5 53.5 29.5L54.1 35.1C44 31.3 20 31.3 9.9 35.1Z" fill="#1a1c3a"/>
    <path d="M53 31.5L60.5 28L58.5 34.5M53.5 33L59.5 37.5" fill="none" stroke="#1a1c3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="19" cy="47" rx="4" ry="2.4" fill="#ff9db0"/>
    <ellipse cx="45" cy="47" rx="4" ry="2.4" fill="#ff9db0"/>
    <path d="M21.5 41.5Q24 38.9 26.5 41.5M37.5 41.5Q40 38.9 42.5 41.5M28.5 47.5Q32 50.9 35.5 47.5" fill="none" stroke="#1a1c3a" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
