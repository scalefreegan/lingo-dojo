<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Figtree:ital,wght@0,400..800;1,400..800&display=swap"
    />
    <title>Lingo Dojo</title>
    <script>
      // Light or dark before the first paint, so a dark page never flashes
      // light while the bundle loads. Same key and rule as src/theme.ts
      // (which takes over once it runs): "light"/"dark" as chosen, anything
      // else follows the system.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("lingo-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
