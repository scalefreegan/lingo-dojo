# The word game's stock pictures (docs/DATA.md §Stock pictures), shared by
# both libraries: concrete, picturable words the kids and adult scenes teach
# or are likely to need. Each is drawn once per install, in the current
# picture theme, by `npm run pictures:stock`; the picturable check may then
# point a word at one instead of drawing a picture of its own.
#
#   id           lowercase letters, digits and hyphens; the file's name
#   description  what the picture shows: a short plain noun phrase (at most
#                12 words and 80 characters; letters and , . ' - only). It
#                is what the theme's prompt receives, so no names, no
#                writing, nothing frightening.
#   words        the English words it stands for (the check matches a
#                word's meaning against these)
#   group        optional: concepts whose pictures look alike (a boy and a
#                brother, a ball and catching one) share a group, and a
#                round never offers two of one group (two right answers)
#   adults       optional, `true`: never offered or shown to a kids
#                learner (beer, wine, pills); adult learners get it
#
# Edit freely: a new concept is drawn by the next `npm run pictures:stock`;
# a changed description is not redrawn by itself (delete its file under
# data/images/stock/<theme>/ first).

